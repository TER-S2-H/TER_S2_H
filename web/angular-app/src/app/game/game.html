<div class="game-wrapper">
  <h2>Pac-Man</h2>
  <div class="game-frame-container">
    <iframe
      [src]="gameUrl"
      width="448"
      height="546"
      frameborder="0"
      allow="autoplay"
      title="Pac-Man Pygbag"
      class="game-frame">
    </iframe>
  </div>
  <p class="hint">Flèches / WASD → déplacer &nbsp;|&nbsp; P → pause &nbsp;|&nbsp; Q → quitter</p>
</div>
